<style>
:root{
  --tinta:#14201e;--tinta-suave:#4a5a56;--papel:#f4f5f3;--papel-2:#e9ebe8;--borde:#dde1dd;
  --brand-deep:#0b6478;--brand-tint:#e3f1ef;--btn-1:#086b63;--brand-2:#2158c9;--brand-shadow:#123a52;
  --ok:#2f6d4f;--ambar:#8a5a12;--ambar-fondo:#fbf2e0;--radio:14px;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--sans);
  font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
h1,h2{font-family:var(--display);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em;font-weight:700}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
p{margin:0 0 1em}
a{color:var(--brand-deep)}

.cab{background:var(--papel);border-bottom:1px solid var(--borde);color:var(--tinta);padding:12px 20px;display:flex;align-items:center;gap:14px}
.cab .marca{display:flex;align-items:center}
.cab .marca img{height:28px;width:auto;display:block}
.cab .paso{margin-left:auto;font-size:.82rem;color:var(--tinta-suave)}
.barra{height:5px;background:var(--papel-2)}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--btn-1),var(--brand-2));width:0;transition:width .3s ease}
.env{max-width:560px;margin:0 auto;padding:28px 20px 44px;width:100%;flex:1}

.ayuda{color:var(--tinta-suave);font-size:.97rem;margin:-.3em 0 1.5em}
.seccion{animation:entra .2s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* campos */
label.campo{display:block;margin-bottom:18px;font-weight:600;font-size:.98rem}
label.campo .opt{font-weight:400;color:var(--tinta-suave);font-size:.88rem}
label.campo input,label.campo select,label.campo textarea{
  display:block;width:100%;font:inherit;font-size:1.02rem;font-weight:400;margin-top:7px;
  padding:14px 15px;border:2px solid var(--borde);border-radius:var(--radio);
  background:#fff;color:var(--tinta);
}
label.campo textarea{min-height:88px;resize:vertical}
label.campo input:focus,label.campo select:focus,label.campo textarea:focus{outline:none;border-color:var(--brand-deep)}
label.campo small{display:block;font-weight:400;color:var(--tinta-suave);font-size:.85rem;margin-top:5px}

.ops{display:grid;gap:10px;margin-bottom:20px}
.op{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  font:inherit;font-size:1rem;font-weight:600;color:var(--tinta);
  background:#fff;border:2px solid var(--borde);border-radius:var(--radio);
  padding:15px 17px;cursor:pointer;
}
.op:hover{border-color:var(--brand-deep)}
.op[aria-pressed="true"]{border-color:var(--brand-deep);background:var(--brand-tint)}
.op .marca-op{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--borde)}
.op[aria-pressed="true"] .marca-op{border-color:var(--brand-deep);background:var(--brand-deep);box-shadow:inset 0 0 0 3px var(--brand-tint)}
.op small{display:block;font-weight:400;color:var(--tinta-suave);font-size:.86rem;margin-top:2px}

/* botones */
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;font:inherit;
  background:linear-gradient(135deg,var(--btn-1),var(--brand-2));color:#fff;font-weight:700;font-size:1.03rem;
  padding:17px 22px;border-radius:var(--radio);border:0;cursor:pointer;
  box-shadow:0 2px 0 var(--brand-shadow);transition:box-shadow .18s ease,transform .06s ease;
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--brand-shadow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-2{background:transparent;color:var(--brand-deep);border:2px solid var(--brand-deep);box-shadow:none;margin-top:10px}
.btn-wa{background:#1f9c53;box-shadow:0 2px 0 #16713b}
@media (hover:hover){.btn:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--brand-shadow),0 12px 22px -10px rgba(11,58,55,.4)}}
.atras{
  background:none;border:0;font:inherit;font-size:.94rem;color:var(--tinta-suave);
  cursor:pointer;padding:14px 4px;display:inline-flex;align-items:center;gap:7px;
}
.micro{font-size:.88rem;color:var(--tinta-suave);text-align:center;margin:12px 0 0}

/* tarjetas y bloques */
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:20px;margin-bottom:14px}
.tarjeta h2{font-size:1.05rem}
.nota{font-size:.9rem;color:var(--tinta-suave)}
.aviso{background:var(--ambar-fondo);border:1px solid var(--ambar);border-radius:var(--radio);padding:16px 18px;margin-bottom:20px;font-size:.94rem}
.animo{background:var(--brand-tint);border-radius:var(--radio);padding:14px 16px;margin-bottom:20px;font-size:.92rem;color:var(--brand-deep);font-weight:600}
.lista-prep{margin:0;padding-left:20px}
.lista-prep li{margin-bottom:8px;font-size:.97rem}

/* repetibles */
.fila-rep{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:16px 18px 4px;margin-bottom:12px;position:relative}
.fila-rep .quitar{
  position:absolute;top:10px;right:10px;background:none;border:0;cursor:pointer;
  color:var(--tinta-suave);font-size:1.4rem;line-height:1;padding:4px 8px;
}
.mas{
  background:none;border:2px dashed var(--borde);color:var(--brand-deep);font:inherit;
  font-weight:600;font-size:.95rem;width:100%;padding:14px;border-radius:var(--radio);
  cursor:pointer;margin-bottom:20px;
}
.mas:hover{border-color:var(--brand-deep)}

/* personas */
.persona{
  display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--borde);
  border-radius:var(--radio);padding:15px 17px;margin-bottom:10px;font-size:1rem;
}
.persona .est{margin-left:auto;font-size:.85rem;font-weight:600}
.persona .est.listo{color:var(--ok)}
.persona .est.pend{color:var(--ambar)}
.persona button{
  background:var(--brand-deep);color:#fff;border:0;border-radius:999px;font:inherit;
  font-size:.85rem;font-weight:700;padding:8px 15px;cursor:pointer;margin-left:auto;
}

/* documentos */
.doc{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:16px 18px;margin-bottom:10px}
.doc p{margin:0 0 10px;font-weight:600;font-size:.97rem}
.doc .estados{display:flex;gap:7px;flex-wrap:wrap}
.doc .estados button{
  font:inherit;font-size:.86rem;font-weight:600;padding:8px 13px;border-radius:999px;
  border:1px solid var(--borde);background:var(--papel);color:var(--tinta-suave);cursor:pointer;
}
.doc .estados button[aria-pressed="true"]{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}

footer{background:var(--papel-2);padding:22px 20px 34px;font-size:.8rem;color:var(--tinta-suave);text-align:center}
footer a{color:var(--brand-deep)}
</style>

/** Reconoce el destino del caso. Devuelve la clave de DESTINOS o
 *  null si no lo puede identificar (por ejemplo "Todavía sin
 *  decidir"), en cuyo caso el expediente deriva a WhatsApp. */
function claveDestino(texto){
  var t = String(texto || "").toLowerCase();
  var encontrada = null;
  Object.keys(DESTINOS).forEach(function(k){
    if (encontrada) return;
    var hay = DESTINOS[k].detecta.some(function(p){ return t.indexOf(p) !== -1; });
    if (hay) encontrada = k;
  });
  return encontrada;
}

/* Mensajes de ánimo que aparecen cada pocas secciones mientras se
 * llena una ficha, para sostener el ritmo y recordar que la
 * información correcta y completa evita que David tenga que llamar
 * después a pedir lo que falta. */
var ANIMOS = [
  "Vas bien. Cada dato correcto que pones ahora es una llamada menos que David tendrá que hacerte después.",
  "Ya llevas buen camino. Si no recuerdas algo con exactitud, mejor revisa el documento antes de escribirlo que adivinar.",
  "Sigue así. Revisa que no quede nada en blanco que puedas completar: eso es lo que más atrasa tu trámite después."
];

/** Diccionario clave -> texto de la pregunta, para que la hoja de
 *  calculo muestre encabezados legibles en vez de claves internas
 *  como "personales__nombres". Se arma con las secciones del
 *  destino del caso y se manda junto con el expediente. */
function mapaEtiquetas(){
  var m = {};
  seccionesDelDestino().forEach(function(s){
    if (s.repetible) { m[s.id + "__lista"] = "Detalle (tabla)"; return; }
    s.campos.forEach(function(c){ m[s.id + "__" + c.id] = c.t; });
  });
  return m;
}

/** Titulo de cada seccion, para que la hoja no dependa de una lista
 *  fija dentro del Apps Script cuando se agregan destinos nuevos. */
function mapaSecciones(){
  var m = {};
  seccionesDelDestino().forEach(function(s){ m[s.id] = s.titulo; });
  return m;
}

/* Qué campos tiene cada sección, en su orden. El Apps Script lo usa
   para armar el Excel de David: sin esto tiene que adivinar el orden
   a partir de las claves que le llegaron, y una sección que la persona
   dejó vacía desordena el resto. */
function ordenSecciones(){
  return seccionesDelDestino().map(function(s){
    return {
      id: s.id,
      campos: s.repetible
        ? [s.id + "__lista"]
        : s.campos.map(function(c){ return s.id + "__" + c.id; })
    };
  });
}

function codigoDeUrl(){
  try { return (new URLSearchParams(location.search).get("caso") || "").toUpperCase(); }
  catch(e){ return ""; }
}

function clave(){ return CLAVE + CODIGO; }
function guardar(){
  try { localStorage.setItem(clave(), JSON.stringify(E)); } catch(e){}
}
function recuperar(){
  try {
    var g = localStorage.getItem(clave());
    if (g) E = JSON.parse(g);
  } catch(e){}
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function ir(html){ app.innerHTML = html; window.scrollTo(0,0); }
function seccionesDelDestino(){ return DESTINO ? DESTINO.secciones : []; }
function documentosDelDestino(){ return DESTINO ? DESTINO.documentos : []; }
function progreso(hecho, total, etiqueta){

function arrancar(){
  if (!CODIGO) {
    return ir(
      '<div class="seccion"><h1>Entra desde la página de tu caso</h1>' +
      '<p class="ayuda">Este formulario se abre desde tu página personal. Ahí está tu código, tu estado y este mismo link. ' +
      'Si no recuerdas tu código, búscalo en el correo que te mandamos.</p>' +
      '<a class="btn" href="../caso/">Abrir mi caso con mi código</a></div>'
    );
  }

  ir('<div class="seccion"><h1>Abriendo tu expediente…</h1><p class="ayuda">Un momento.</p></div>');

  fetch(ENDPOINT + "?caso=" + encodeURIComponent(CODIGO))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) throw new Error("no encontrado");
      caso = d;
      DESTINO = DESTINOS[claveDestino(caso.destino)] || null;
      recuperar();
      if (E.personas && E.personas.length) pantallaPersonas();
      else confirmarIdentidad();
    })
    .catch(function(){
      ir(
        '<div class="seccion"><h1>No pudimos abrir tu expediente</h1>' +
        '<p class="ayuda">Puede que el link esté incompleto o que haya un problema de conexión. Escríbele a David y lo revisamos.</p>' +
        '<a class="btn btn-wa" href="https://wa.me/' + WHATSAPP + '?text=' +
        encodeURIComponent("Hola David, no puedo abrir mi expediente. Mi código es " + CODIGO + ".") +
        '">Avisar por WhatsApp</a></div>'
      );
    });
}

function seccionesQueAplican(datos){
  return seccionesDelDestino().filter(function(s){ return !s.si || s.si(datos); });
}

function pintarSeccion(){
  var per = E.personas[E.actual];
  var secciones = seccionesQueAplican(per.datos);
  if (E.seccion >= secciones.length) return revisarPersona();

  var s = secciones[E.seccion];
  progreso(E.seccion, secciones.length, per.nombre + " · " + (E.seccion+1) + " de " + secciones.length);

  var html = '<div class="seccion"><h1>' + esc(s.titulo) + '</h1>';
  if (s.ayuda) html += '<p class="ayuda">' + esc(s.ayuda) + '</p>';
  if (E.seccion > 0 && E.seccion % 3 === 0) {
    var animo = ANIMOS[(Math.floor(E.seccion / 3) - 1) % ANIMOS.length];
    html += '<div class="animo">' + esc(animo) + '</div>';
  }

  if (s.repetible) {
    html += '<div id="filas"></div>';
    html += '<button class="mas" type="button" id="mas">+ Agregar ' + esc(s.repetible.etiqueta) + '</button>';
  } else {
    s.campos.forEach(function(c){ html += campoHtml(s.id, c, per.datos); });
  }

  html += '<button class="btn" type="button" id="siguiente">Continuar</button>';
  html += '<div><button class="atras" type="button" id="atras">← ' +
          (E.seccion === 0 ? "Volver a la lista" : "Sección anterior") + '</button></div>';
  html += '</div>';
  ir(html);

  if (s.repetible) pintarRepetible(s, per);

  document.getElementById("siguiente").addEventListener("click", function(){
    if (!s.repetible && !recogerCampos(s, per)) return;
    E.seccion++;
    guardar();
    pintarSeccion();
  });
  document.getElementById("atras").addEventListener("click", function(){
    if (!s.repetible) recogerCampos(s, per, true);
    if (E.seccion === 0) { guardar(); pantallaPersonas(); }
    else { E.seccion--; guardar(); pintarSeccion(); }
  });
}

function campoHtml(seccion, c, datos){
  var k = seccion + "__" + c.id;
  var v = datos[k] === undefined ? "" : datos[k];
  var etiqueta = esc(c.t) + (c.opcional ? ' <span class="opt">(opcional)</span>' : "");
  var h = '<label class="campo" data-k="' + k + '">' + etiqueta;

  if (c.tipo === "opcion") {
    h += '<select id="c_' + k + '">';
    h += '<option value="">Elige una opción</option>';
    c.opciones.forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (v === o ? " selected" : "") + '>' + esc(o) + '</option>';
    });
    h += '</select>';
  } else if (c.tipo === "larga") {
    h += '<textarea id="c_' + k + '">' + esc(v) + '</textarea>';
  } else {
    var t = c.tipo === "fecha" ? "date" :
            c.tipo === "tel" ? "tel" :
            c.tipo === "correo" ? "email" :
            c.tipo === "numero" ? "number" : "text";
    h += '<input type="' + t + '" id="c_' + k + '" value="' + esc(v) + '">';
  }
  if (c.ayuda) h += '<small>' + esc(c.ayuda) + '</small>';
  h += '</label>';
  return h;
}

function recogerCampos(s, per, silencioso){
  var falta = null;
  s.campos.forEach(function(c){
    var k = s.id + "__" + c.id;
    var el = document.getElementById("c_" + k);
    if (!el) return;
    var v = el.value.trim();
    per.datos[k] = v;
    if (c.req && !v && !falta) falta = el;
  });
  if (falta && !silencioso) {
    falta.focus();
    falta.style.borderColor = "#8a2f2f";
    return false;
  }
  return true;
}

function pintarRepetible(s, per){
  var cont = document.getElementById("filas");
  var lista = per.datos[s.id + "__lista"] || [];

  function dibujar(){
    cont.innerHTML = lista.map(function(fila, i){
      var h = '<div class="fila-rep"><button class="quitar" type="button" data-i="' + i + '" aria-label="Quitar">×</button>';
      s.repetible.campos.forEach(function(c){
        var v = fila[c.id] || "";
        h += '<label class="campo">' + esc(c.t);
        if (c.tipo === "opcion") {
          h += '<select data-i="' + i + '" data-c="' + c.id + '"><option value="">Elige</option>' +
               c.opciones.map(function(o){
                 return '<option value="' + esc(o) + '"' + (v === o ? " selected" : "") + '>' + esc(o) + '</option>';
               }).join("") + '</select>';
        } else {
          h += '<input type="' + (c.tipo === "fecha" ? "date" : "text") + '" data-i="' + i + '" data-c="' + c.id + '" value="' + esc(v) + '">';
        }
        h += '</label>';
      });
      return h + '</div>';
    }).join("");

    [].forEach.call(cont.querySelectorAll("[data-c]"), function(el){
      el.addEventListener("input", function(){
        lista[parseInt(el.dataset.i,10)][el.dataset.c] = el.value.trim();
        per.datos[s.id + "__lista"] = lista;
        guardar();
      });
      el.addEventListener("change", function(){
        lista[parseInt(el.dataset.i,10)][el.dataset.c] = el.value.trim();
        per.datos[s.id + "__lista"] = lista;
        guardar();
      });
    });
    [].forEach.call(cont.querySelectorAll(".quitar"), function(b){
      b.addEventListener("click", function(){
        lista.splice(parseInt(b.dataset.i,10), 1);
        per.datos[s.id + "__lista"] = lista;
        guardar();
        dibujar();
      });
    });
  }

  dibujar();
  document.getElementById("mas").addEventListener("click", function(){
    lista.push({});
    per.datos[s.id + "__lista"] = lista;
    guardar();
    dibujar();
  });
}

/* ============================================================
   6. REVISIÓN POR PERSONA
   ============================================================ */

function revisarPersona(){
  var per = E.personas[E.actual];
  per.completa = true;
  guardar();
  progreso(1, 1, per.nombre);
  ir(
    '<div class="seccion">' +
      '<h1>Listo, ' + esc((per.nombre || "").split(" ")[0]) + '</h1>' +
      '<p class="ayuda">Su ficha quedó completa. Puedes volver a corregirla cuando quieras desde la lista.</p>' +
      '<button class="btn" type="button" id="volver">Volver a la lista</button>' +
      '<button class="btn btn-2" type="button" id="revisar">Revisar lo que llené</button>' +
    '</div>'
  );
  document.getElementById("volver").addEventListener("click", pantallaPersonas);
  document.getElementById("revisar").addEventListener("click", function(){
    E.seccion = 0; guardar(); pintarSeccion();
  });
}

/* ============================================================
   7. DOCUMENTOS
   ============================================================ */

function pantallaDocumentos(){
  progreso(1, 1, "Documentos");
  var docs = documentosDelDestino();
  var pendiente = "Marca los " + docs.length + " documentos para continuar.";
  var html = '<div class="seccion">' +
    '<h1>¿Qué documentos ya tienes?</h1>' +
    '<p class="ayuda">Solo dinos cómo estás con cada uno. No hace falta subir nada aquí: los envías por WhatsApp cuando David te los pida.</p>';

  docs.forEach(function(d, i){
    var v = E.documentos[i] || "";
    html += '<div class="doc"><p>' + esc(d) + '</p><div class="estados">' +
      ["Lo tengo","En trámite","No lo tengo","No aplica"].map(function(op){
        return '<button type="button" data-i="' + i + '" data-v="' + esc(op) + '" aria-pressed="' + (v === op) + '">' + esc(op) + '</button>';
      }).join("") +
      '</div></div>';
  });

  html += '<button class="btn" type="button" id="enviar" disabled>Enviar mi expediente</button>';
  html += '<p class="micro" id="pista">' + esc(pendiente) + '</p>';
  html += '<div><button class="atras" type="button" id="atras">← Volver a la lista</button></div>';
  html += '</div>';
  ir(html);

  function revisar(){
    var listos = docs.every(function(_, i){ return E.documentos[i]; });
    document.getElementById("enviar").disabled = !listos;
    document.getElementById("pista").textContent = listos
      ? "Al enviar, David recibe tu expediente y sabe qué te falta."
      : pendiente;
  }

  [].forEach.call(document.querySelectorAll(".estados button"), function(b){
    b.addEventListener("click", function(){
      var i = b.dataset.i;
      E.documentos[i] = b.dataset.v;
      guardar();
      [].forEach.call(document.querySelectorAll('.estados button[data-i="' + i + '"]'), function(o){
        o.setAttribute("aria-pressed", o === b);
      });
      revisar();
    });
  });
  revisar();
  document.getElementById("enviar").addEventListener("click", enviar);
  document.getElementById("atras").addEventListener("click", pantallaPersonas);
}

/* ============================================================
   8. ENVÍO
   ============================================================ */

function enviar(){
  var btn = document.getElementById("enviar");
  btn.disabled = true;
  btn.textContent = "Enviando…";

  var documentos = documentosDelDestino().map(function(d, i){
    return { nombre: d, estado: E.documentos[i] || "Sin marcar" };
  });

  var carga = {
    tipo: "expediente",
    codigo: CODIGO,
    titular: E.titular,
    destinoNombre: caso.destino,
    destinoClave: claveDestino(caso.destino) || "",
    personas: E.personas.map(function(p){
      var o = { nombre_ficha: p.nombre };
      Object.keys(p.datos).forEach(function(k){
        var v = p.datos[k];
        o[k] = (v && typeof v === "object") ? JSON.stringify(v) : v;
      });
      return o;
    }),
    documentos: documentos,
    etiquetas: mapaEtiquetas(),
    secciones: mapaSecciones(),
    orden: ordenSecciones()
  };

  /* Se espera la respuesta del script antes de decir "enviado".
     Antes esto iba en no-cors: el navegador no podía leer la
     respuesta, así que un guardado fallido se veía igual que uno
     bueno y la persona se iba tranquila con su expediente perdido.
     El envío no lleva cabeceras que disparen preflight, así que
     Google contesta con Access-Control-Allow-Origin desde la
     redirección y sí se puede leer. */
  fetch(ENDPOINT, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(carga)
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) throw new Error(d && d.error ? d.error : "no guardado");
      pantallaFinal(documentos);
    })
    ["catch"](function(err){
      pantallaFalloEnvio(String(err && err.message ? err.message : err), documentos);
    });
}

/* Si el guardado falló, se dice. Callar aquí es lo peor que puede
   pasar: la persona da por hecho que su expediente llegó, David nunca
   lo recibe, y nadie se entera hasta la cita. */
function pantallaFalloEnvio(motivo, documentos){
  ir(
    '<div class="seccion">' +
      '<h1>Tu expediente no se pudo enviar</h1>' +
      '<p class="ayuda">No lo perdiste: todo lo que llenaste sigue guardado en este navegador. ' +
      'Vuelve a intentarlo en un momento, o avísale a David.</p>' +
      '<button class="btn" type="button" id="reintentar">Volver a intentar</button>' +
      '<a class="btn btn-wa" style="margin-top:12px" href="https://wa.me/' + WHATSAPP + '?text=' +
        encodeURIComponent("Hola David, mi expediente " + CODIGO + " no se pudo enviar desde la página.") +
        '">Avisarle a David</a>' +
      '<p class="nota" style="margin-top:16px">Detalle técnico: ' + esc(motivo) + '</p>' +
    '</div>'
  );
  document.getElementById("reintentar").addEventListener("click", pantallaDocumentos);
}

function pantallaFinal(documentos){
  var faltan = documentos.filter(function(d){
    return d.estado === "No lo tengo" || d.estado === "En trámite";
  });

  var linea = "Hola David, terminé mi expediente " + CODIGO + ". " +
    E.personas.length + (E.personas.length === 1 ? " persona." : " personas.");
  if (faltan.length) {
    linea += " Me falta: " + faltan.map(function(d){ return d.nombre + " (" + d.estado.toLowerCase() + ")"; }).join(", ") + ".";
  } else {
    linea += " Tengo todos los documentos listos.";
  }

  var html = '<div class="seccion">' +
    '<h1>Expediente enviado</h1>' +
    '<p class="ayuda">Confirmado: tu información quedó guardada y a David ya le llegó, con todo lleno. ' +
    'Ahora la revisa y te escribe para coordinar la cita y los últimos detalles. No hace falta que le avises.</p>' +
    '<div class="tarjeta">' +
      '<p class="nota" style="margin:0 0 4px">Código de tu caso</p>' +
      '<p style="margin:0;font-size:1.3rem;font-weight:700;letter-spacing:.06em">' + esc(CODIGO) + '</p>' +
    '</div>';

  if (faltan.length) {
    html += '<div class="aviso"><strong>Lo que todavía falta:</strong><br>' +
      faltan.map(function(d){ return esc(d.nombre) + " — " + esc(d.estado.toLowerCase()); }).join("<br>") +
      '</div>';
  }

  html += '<a class="btn" href="../caso/?c=' + encodeURIComponent(CODIGO) + '">Volver a mi caso</a>' +
    '<p class="micro">Ahí sigues viendo en qué punto va tu trámite.</p>' +
    '<a class="btn btn-wa" style="margin-top:16px" href="https://wa.me/' + WHATSAPP + '?text=' +
      encodeURIComponent(linea) + '">Escribirle a David</a>' +
    '<p class="micro">Solo si quieres decirle algo que el formulario no recogió.</p>' +
    '<p class="micro" style="margin-top:24px"><a href="../">Volver a la página</a></p>' +
    '</div>';

  ir(html);
  progreso(1, 1, "Enviado");
}

arrancar();
</script>
