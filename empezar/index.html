<style>
:root{
  --tinta:#14201e;--tinta-suave:#4a5a56;--papel:#f4f5f3;--papel-2:#e9ebe8;--borde:#dde1dd;

  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--sans);
  font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
h1,h2{font-family:var(--display);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em;font-weight:700}
h1{font-size:1.65rem}
h2{font-size:1.35rem}
p{margin:0 0 1em}
a{color:var(--brand-deep)}

/* cabecera + progreso */
.cab{background:var(--papel);border-bottom:1px solid var(--borde);color:var(--tinta);padding:12px 20px;display:flex;align-items:center;gap:14px}
.cab .marca{display:flex;align-items:center}
.cab .marca img{height:28px;width:auto;display:block}
.cab .paso{margin-left:auto;font-size:.85rem;color:var(--tinta-suave)}
.barra{height:5px;background:var(--papel-2)}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--btn-1),var(--brand-2));width:0;transition:width .3s ease}

.env{max-width:560px;margin:0 auto;padding:28px 20px 40px;width:100%;flex:1}

/* preguntas */
.pregunta{display:none}
.pregunta.activa{display:block;animation:entra .22s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ayuda{color:var(--tinta-suave);font-size:.97rem;margin:-.3em 0 1.4em}

.ops{display:grid;gap:10px}
.op{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  font:inherit;font-size:1.02rem;font-weight:600;color:var(--tinta);
  background:#fff;border:2px solid var(--borde);border-radius:var(--radio);
  padding:17px 18px;cursor:pointer;transition:border-color .12s ease,background .12s ease;
}
.op:hover{border-color:var(--brand-deep)}
.op:active{background:var(--brand-tint)}
.op .marca-op{
  flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--borde);
}
.op[aria-pressed="true"]{border-color:var(--brand-deep);background:var(--brand-tint)}
.op[aria-pressed="true"] .marca-op{border-color:var(--brand-deep);background:var(--brand-deep);box-shadow:inset 0 0 0 3px var(--brand-tint)}
.op small{display:block;font-weight:400;color:var(--tinta-suave);font-size:.88rem;line-height:1.35;margin-top:2px}

/* campos */
label.campo{display:block;margin-bottom:16px;font-weight:600;font-size:1rem}
label.campo input{
  display:block;width:100%;font:inherit;font-size:1.05rem;font-weight:400;margin-top:7px;
  padding:15px 16px;border:2px solid var(--borde);border-radius:var(--radio);
  background:#fff;color:var(--tinta);
}
label.campo input:focus{outline:none;border-color:var(--brand-deep)}
label.campo small{display:block;font-weight:400;color:var(--tinta-suave);font-size:.87rem;margin-top:5px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--tinta-suave);line-height:1.45;margin:6px 0 20px;font-weight:400}
.consent input{flex:0 0 22px;width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand-deep)}

/* botones */
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;font:inherit;
  background:linear-gradient(135deg,var(--btn-1),var(--brand-2));color:#fff;font-weight:700;font-size:1.05rem;
  padding:17px 22px;border-radius:var(--radio);border:0;cursor:pointer;
  box-shadow:0 2px 0 var(--brand-shadow);transition:box-shadow .18s ease,transform .06s ease;
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--brand-shadow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-wa{background:#1f9c53;box-shadow:0 2px 0 #16713b}
.btn-2{background:transparent;color:var(--brand-deep);border:2px solid var(--brand-deep);box-shadow:none}
@media (hover:hover){.btn:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--brand-shadow),0 12px 22px -10px rgba(11,58,55,.4)}}
.atras{
  background:none;border:0;font:inherit;font-size:.95rem;color:var(--tinta-suave);
  cursor:pointer;padding:14px 4px;display:inline-flex;align-items:center;gap:7px;
}
.pie-nav{margin-top:22px}

/* resultado */
.res{border-radius:var(--radio);padding:24px;margin-bottom:22px;border:2px solid}
.res h1{margin-bottom:.35em}
.res.verde{background:var(--ok-fondo);border-color:var(--ok)}
.res.verde h1{color:var(--ok)}
.res.ambar{background:var(--ambar-fondo);border-color:var(--ambar)}
.res.ambar h1{color:var(--ambar)}
.res.rojo{background:var(--rojo-fondo);border-color:var(--rojo)}
.res.rojo h1{color:var(--rojo)}
.res p:last-child{margin-bottom:0}
ul.puntos{list-style:none;padding:0;margin:0 0 22px}
ul.puntos li{
  background:#fff;border:1px solid var(--borde);border-radius:10px;
  padding:14px 16px;margin-bottom:9px;font-size:.98rem;
}
ul.puntos li b{display:block;margin-bottom:2px}
ul.puntos li span{color:var(--tinta-suave);font-size:.92rem}
.recuadro{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:20px;margin-bottom:20px}
.recuadro h2{font-size:1.1rem}
.recuadro ol{margin:0;padding-left:20px}
.recuadro li{margin-bottom:8px;font-size:.97rem;color:var(--tinta-suave)}
.nota{font-size:.88rem;color:var(--tinta-suave)}

footer{background:var(--papel-2);padding:22px 20px 34px;font-size:.8rem;color:var(--tinta-suave);text-align:center}

<script>

var WHATSAPP = "593998961214";

/* Dónde se graban los casos completos.

/* Cada pregunta:
   id        clave con la que se guarda la respuesta
   titulo    lo que se lee grande
   ayuda     línea explicativa opcional
   opciones  [{v: valor, t: texto, s: subtexto, p: puntos,
               bandera: "texto",   // punto flojo serio, se muestra siempre
               flojo:   "texto",   // punto flojo leve, solo si el caso no es verde

   si        función(r) -> true si esta pregunta aplica al caso   */

var PREGUNTAS = [
  {
    id: "destino",
    titulo: "¿Cuál es tu país destino?",
    opciones: [

  },
  {

    opciones: [
      {v:"si", t:"Sí, varias cosas cambiaron",  p:2, fuerte:"Su situación cambió desde la negación anterior"},

    ]
  },
  {
    id: "viajes",

    ayuda: "Considera cualquier viaje al extranjero, aunque haya sido hace años.",
    opciones: [

      {v:"fuerte", t:"Sí, a Estados Unidos, Canadá, Europa o Asia", p:3, fuerte:"Ha viajado a Estados Unidos, Canadá, Europa o Asia"}

      {v:"independiente",t:"Trabajo por mi cuenta o tengo negocio propio", p:1},
      {v:"estudiante",   t:"Soy estudiante", p:0, flojo:"Como estudiante hay que reforzar el respaldo económico"},
      {v:"jubilado",     t:"Soy jubilado", p:1},
      {v:"sin",          t:"Ahora mismo no estoy trabajando", p:-2, bandera:"Sin actividad laboral actual"}
    ]
  },
  {
    id: "antiguedad",
    si: function(r){ return r.trabajo === "empleado" || r.trabajo === "independiente"; },
    titulo: "¿Cuánto tiempo llevas ahí?",
    opciones: [
      {v:"menos6", t:"Menos de 6 meses",   p:-2, bandera:"Muy poco tiempo en la actividad actual"},
      {v:"6a24",   t:"Entre 6 meses y 2 años", p:1, flojo:"Poco tiempo en tu actividad actual"},
      {v:"mas2",   t:"Más de 2 años",      p:2, fuerte:"Más de 2 años en su actividad actual"}
    ]
  },
  {
    id: "ingresos",
    titulo: "¿Puedes acreditar tus ingresos o ahorros con documentos?",
    ayuda: "Rol de pagos, certificado bancario, movimientos de cuenta o declaración de impuestos.",
    opciones: [
      {v:"si",   t:"Sí, sin problema", p:2, fuerte:"Puede acreditar ingresos con documentos"},
      {v:"algo", t:"Algo, pero no todo", s:"Parte de mis ingresos no están respaldados", p:0, flojo:"Parte de tus ingresos no se puede acreditar documentalmente"},
      {v:"no",   t:"No, me sería difícil", p:-2, bandera:"Ingresos difíciles de demostrar"}

  {
    id: "dependientes",
    titulo: "¿Tienes hijos o personas que dependan de ti aquí en Ecuador?",
    opciones: [
      {v:"si", t:"Sí", p:2, fuerte:"Tiene hijos o dependientes en Ecuador"},
      {v:"no", t:"No", p:0, flojo:"Sin hijos ni dependientes en Ecuador"}
    ]
  },
  {
    id: "pareja",
    titulo: "¿Tienes pareja o cónyuge?",
    opciones: [
      {v:"si_queda", t:"Sí, y se queda en Ecuador", p:1, fuerte:"Su pareja se queda en Ecuador"},
      {v:"si_viaja", t:"Sí, y viaja conmigo", p:0},
      {v:"no",       t:"No tengo pareja", p:0}
    ]
  },
  {
    id: "bienes",
    titulo: "¿Tienes casa, terreno, vehículo o negocio a tu nombre?",
    ayuda: "No son un requisito. Únicamente suman a favor si los tienes.",
    opciones: [
      {v:"si", t:"Sí, alguno de esos", p:2, fuerte:"Tiene bienes a su nombre"},
      {v:"no", t:"No, ninguno", p:0, flojo:"Sin bienes a tu nombre"}
    ]
  },
  {
    id: "pasaporte",
    titulo: "¿Cómo está tu pasaporte?",
    opciones: [
      {v:"vigente", t:"Vigente, le queda más de un año", p:1, fuerte:"Pasaporte vigente con buen margen"},
      {v:"pronto",  t:"Vigente, pero vence pronto", s:"En menos de 6 meses", p:0, bandera:"Pasaporte próximo a vencer: hay que renovarlo primero"},
      {v:"no",      t:"No tengo pasaporte todavía", p:0, bandera:"Sin pasaporte: es el primer trámite a resolver"}
    ]
  },
  {
    id: "cuando",
    titulo: "¿Para cuándo quieres viajar?",
    opciones: [
      {v:"ya",     t:"Lo antes posible", s:"En menos de un mes", p:0, bandera:"Fecha muy justa: las citas consulares tardan semanas"},
      {v:"1a3",    t:"En uno a tres meses", p:0},
      {v:"3a6",    t:"En tres a seis meses", p:0},
      {v:"mas6",   t:"Más adelante, o sin fecha fija", p:0}
    ]
  },
  {
    id: "personas",
    titulo: "¿Cuántas personas van a aplicar?",
    ayuda: "Contándote a ti.",
    opciones: [
      {v:"1", t:"Solo yo"},
      {v:"2", t:"Dos personas"},
      {v:"3", t:"Tres personas"},
      {v:"4", t:"Cuatro o más"}
    ]
  }
];

/* Cómo se explica cada punto flojo en el resultado */
var CONSEJOS = {
  "Sin viajes internacionales previos":
    "Un viaje breve a otro país antes de aplicar fortalece de forma notable tu caso. Si no resulta posible, reforzamos el perfil por la vía laboral y familiar.",
  "Muy poco tiempo en la actividad actual":
    "Con más tiempo en la misma actividad, tu perfil transmite mayor estabilidad. En ocasiones conviene esperar unos meses.",
  "Sin actividad laboral actual":
    "Sin una actividad que acredite tu motivo de retorno, el caso queda debilitado. Es el primer punto a resolver.",
  "Ingresos difíciles de demostrar":
    "Existen formas de acreditar los ingresos de un negocio propio o de un trabajo independiente. Lo revisamos contigo.",
  "Negación reciente sin cambios en el perfil":
    "Presentarse nuevamente sin cambios en el perfil suele conducir al mismo resultado. Conviene fortalecer el caso antes de volver a aplicar.",
  "Pasaporte próximo a vencer: hay que renovarlo primero":
    "Conviene renovar el pasaporte antes de iniciar. El trámite es ágil y evita rehacer la documentación más adelante.",
  "Sin pasaporte: es el primer trámite a resolver":
    "El pasaporte es el punto de partida del proceso. Una vez lo tengas, continuamos.",
  "Fecha muy justa: las citas consulares tardan semanas":
    "La disponibilidad de citas no depende de nosotros y suele demorar. Conviene iniciar cuanto antes o reconsiderar la fecha del viaje.",
  "Solo has viajado dentro de Latinoamérica":
    "Suma a tu favor, aunque tiene menos peso que un viaje a Europa, Estados Unidos o Asia. Reforzamos el caso por la vía del arraigo.",
  "Parte de tus ingresos no se puede acreditar documentalmente":
    "Existen formas de documentar los ingresos de un negocio propio o de un trabajo independiente. Lo revisamos contigo.",
  "Poco tiempo en tu actividad actual":
    "Cuanto mayor sea tu antigüedad, más estable resulta tu perfil. En ocasiones conviene esperar unos meses.",
  "Sin hijos ni dependientes en Ecuador":
    "No es un requisito. Cuando no existen, se refuerza el perfil por la vía laboral y económica.",
  "Sin bienes a tu nombre":
    "Tampoco es un requisito. Se compensa con estabilidad laboral, vínculos familiares e ingresos acreditables.",
  "Como estudiante hay que reforzar el respaldo económico":
    "Habitualmente mediante el respaldo de quien financia el viaje y el certificado de estudios vigente.",
  "Cambió poco desde la negación anterior":
    "Cuanto más haya cambiado tu situación desde la negativa anterior, mejores son tus probabilidades."
};

var NOMBRE_DESTINO = {usa:"Estados Unidos", canada:"Canadá", schengen:"Europa (Schengen)", "no-se":"Todavía sin decidir"};

/* ============================================================
   MOTOR
   ============================================================ */

var app = document.getElementById("app");
var barra = document.getElementById("barra");
var etiquetaPaso = document.getElementById("etiqueta-paso");
var respuestas = {};
var banderas = [];
var indice = 0;
var historial = [];

/* Prellenar destino desde la URL: empezar/?destino=usa */
(function(){
  try {
    var p = new URLSearchParams(location.search);
    var d = p.get("destino");
    if (d && ["usa","canada","schengen"].indexOf(d) !== -1) respuestas.destino = d;
    var pais = p.get("pais");
    if (pais) respuestas.pais_schengen = pais;
  } catch(e){}
  try {
    var g = localStorage.getItem(CLAVE_GUARDADO);
    if (g) {
      var d2 = JSON.parse(g);
      if (d2 && d2.respuestas) respuestas = Object.assign(d2.respuestas, respuestas);
    }
  } catch(e){}
})();

function guardar(){
  try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify({respuestas:respuestas, fecha:Date.now()})); } catch(e){}
}

function aplica(q){ return !q.si || q.si(respuestas); }

function siguienteIndice(desde){
  for (var i = desde; i < PREGUNTAS.length; i++){
    if (aplica(PREGUNTAS[i]) && respuestas[PREGUNTAS[i].id] === undefined) return i;
  }
  return -1;
}

function totalAplicables(){
  return PREGUNTAS.filter(aplica).length;
}

function contestadas(){
  return PREGUNTAS.filter(function(q){ return aplica(q) && respuestas[q.id] !== undefined; }).length;
}

function progreso(){
  var t = totalAplicables();
  barra.style.width = Math.round((contestadas() / t) * 100) + "%";
  etiquetaPaso.textContent = "Pregunta " + Math.min(contestadas()+1, t) + " de " + t;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function pintarPregunta(i){
  var q = PREGUNTAS[i];
  indice = i;
  progreso();

  var html = '<div class="pregunta activa">';
  html += '<h1>' + esc(q.titulo) + '</h1>';
  if (q.ayuda) html += '<p class="ayuda">' + esc(q.ayuda) + '</p>';
  html += '<div class="ops">';
  q.opciones.forEach(function(op){
    html += '<button class="op" type="button" data-v="' + esc(op.v) + '" aria-pressed="false">' +
              '<span class="marca-op"></span>' +
              '<span>' + esc(op.t) + (op.s ? '<small>' + esc(op.s) + '</small>' : '') + '</span>' +
            '</button>';
  });
  html += '</div>';
  if (historial.length) html += '<div class="pie-nav"><button class="atras" type="button" id="atras">← Volver a la anterior</button></div>';
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0,0);

  app.querySelectorAll(".op").forEach(function(b){
    b.addEventListener("click", function(){
      b.setAttribute("aria-pressed","true");
      var op = q.opciones.filter(function(o){ return String(o.v) === b.dataset.v; })[0];
      respuestas[q.id] = op.v;
      guardar();
      setTimeout(function(){ avanzar(i); }, 160);
    });
  });

  var atras = document.getElementById("atras");
  if (atras) atras.addEventListener("click", function(){
    var prev = historial.pop();
    if (prev === undefined) return;
    delete respuestas[PREGUNTAS[prev].id];
    guardar();
    pintarPregunta(prev);
  });
}

function avanzar(desde){
  historial.push(desde);
  var sig = siguienteIndice(0);
  if (sig === -1) pintarContacto();
  else pintarPregunta(sig);
}

/* ---------- puntuación ---------- */
function calcular(){
  var puntos = 0;
  banderas = [];
  var flojos = [];
  var fuertes = [];
  PREGUNTAS.forEach(function(q){
    if (!aplica(q)) return;
    var v = respuestas[q.id];
    if (v === undefined) return;
    var op = q.opciones.filter(function(o){ return String(o.v) === String(v); })[0];
    if (!op) return;
    if (typeof op.p === "number") puntos += op.p;
    if (op.bandera) banderas.push(op.bandera);
    if (op.flojo) flojos.push(op.flojo);
    if (op.fuerte) fuertes.push(op.fuerte);
  });

  var semaforo = puntos >= 6 ? "verde" : (puntos >= 2 ? "ambar" : "rojo");

  /* Reglas duras: mandan por encima del puntaje.
     Salen de los descalificadores que David usa en su propio guion. */
  if (respuestas.aplico_antes === "negada" &&
      respuestas.cuando_negada === "menos1" &&
      respuestas.cambio_algo === "no") {
    semaforo = "rojo";
  }
  if (respuestas.pasaporte === "no") {
    semaforo = semaforo === "verde" ? "ambar" : semaforo;
  }

  /* En verde solo se muestran los puntos serios; en ámbar y rojo, todos. */
  var mostrar = semaforo === "verde" ? banderas : banderas.concat(flojos);

  return {puntos:puntos, semaforo:semaforo, banderas:banderas, flojos:flojos, fuertes:fuertes, mostrar:mostrar};
}

/* ---------- pantalla de contacto ---------- */
function pintarContacto(){
  barra.style.width = "100%";
  etiquetaPaso.textContent = "Último paso";
  app.innerHTML =
    '<div class="pregunta activa">' +
      '<h1>Listo. ¿A dónde te enviamos el resultado?</h1>' +
      '<p class="ayuda">Te escribimos por WhatsApp con cómo está tu caso y los siguientes pasos.</p>' +
      '<label class="campo">Tu nombre y apellido' +
        '<input type="text" id="c-nombre" autocomplete="name" placeholder="Ana Pérez">' +
      '</label>' +
      '<label class="campo">Tu WhatsApp' +
        '<input type="tel" id="c-tel" autocomplete="tel" inputmode="numeric" placeholder="09 9999 9999">' +
        '<small>Con el 09 al inicio, como lo marcas normalmente.</small>' +
      '</label>' +
      '<label class="campo">Tu correo <span style="font-weight:400;color:#4a5a56">(opcional)</span>' +
        '<input type="email" id="c-mail" autocomplete="email" placeholder="ana@correo.com">' +
      '</label>' +
      '<label class="consent"><input type="checkbox" id="c-ok">' +
        '<span>Autorizo a MiVisa EC a usar estos datos para revisar mi caso y contactarme. Puedo pedir que los borren cuando quiera. He leído los <a href="../terminos.html" target="_blank">términos</a> y la <a href="../privacidad.html" target="_blank">política de privacidad</a>.</span>' +
      '</label>' +
      '<button class="btn" type="button" id="ver" disabled>Ver el resultado de mi caso</button>' +
      '<div class="pie-nav"><button class="atras" type="button" id="atras">← Volver a la anterior</button></div>' +
    '</div>';
  window.scrollTo(0,0);

  var nombre = document.getElementById("c-nombre");
  var tel = document.getElementById("c-tel");
  var mail = document.getElementById("c-mail");
  var ok = document.getElementById("c-ok");
  var ver = document.getElementById("ver");

  function revisar(){
    var telLimpio = tel.value.replace(/\D/g,"");
    ver.disabled = !(nombre.value.trim().length > 2 && telLimpio.length >= 9 && ok.checked);
  }
  [nombre, tel, mail].forEach(function(c){ c.addEventListener("input", revisar); });
  ok.addEventListener("change", revisar);

  ver.addEventListener("click", function(){
    respuestas.nombre = nombre.value.trim();
    respuestas.telefono = tel.value.trim();
    respuestas.correo = mail.value.trim();
    respuestas.consentimiento = true;
    guardar();
    pintarResultado();
  });

  document.getElementById("atras").addEventListener("click", function(){
    var prev = historial.pop();
    if (prev === undefined) return;
    delete respuestas[PREGUNTAS[prev].id];
    guardar();
    pintarPregunta(prev);
  });
}

/* ---------- resultado ---------- */
function resumenParaDavid(r){
  var l = [];
  l.push("*Caso nuevo · MiVisa EC*");
  l.push("");
  l.push(respuestas.nombre);
  l.push("País destino: " + (NOMBRE_DESTINO[respuestas.destino] || respuestas.destino) +
         (respuestas.personas && respuestas.personas !== "1" ? " · " + respuestas.personas + " personas" : ""));
  l.push("Semáforo: " + ({verde:"VERDE", ambar:"ÁMBAR", rojo:"ROJO"})[r.semaforo]);
  if (r.fuertes.length){
    l.push("");
    l.push("A favor:");
    r.fuertes.forEach(function(b){ l.push("• " + b); });
  }
  if (r.mostrar.length){
    l.push("");
    l.push("En contra:");
    r.mostrar.forEach(function(b){ l.push("• " + b); });
  }
  l.push("");
  l.push("El detalle completo está en la hoja de casos.");
  return l.join(String.fromCharCode(10));
}

/* Manda el caso completo a la hoja de cálculo.
   Va en segundo plano: si falla, el usuario no se entera y el flujo sigue. */
function guardarEnHoja(r){
  if (!ENDPOINT_GUARDADO) return;
  var fila = {
    fecha: new Date().toISOString(),
    nombre: respuestas.nombre || "",
    telefono: respuestas.telefono || "",
    correo: respuestas.correo || "",
    destino: NOMBRE_DESTINO[respuestas.destino] || respuestas.destino || "",
    pais_schengen: respuestas.pais_schengen || "",
    personas: respuestas.personas || "",
    semaforo: r.semaforo,
    puntos: r.puntos,
    a_favor: r.fuertes.join(" | "),
    en_contra: r.mostrar.join(" | "),
    consentimiento: respuestas.consentimiento ? "Sí" : "No"
  };
  PREGUNTAS.forEach(function(q){
    var v = respuestas[q.id];
    if (v === undefined) { fila[q.id] = ""; return; }
    var op = q.opciones.filter(function(o){ return String(o.v) === String(v); })[0];
    fila[q.id] = op ? op.t : v;
  });
  /* Contra Apps Script hay que ir en no-cors (Google no manda cabeceras
     CORS y el navegador bloquearía la lectura). Contra el Worker de
     Cloudflare sí se puede ir en modo normal y saber si falló. */
  var directoAGoogle = ENDPOINT_GUARDADO.indexOf("script.google.com") !== -1;
  try {
    fetch(ENDPOINT_GUARDADO, {
      method: "POST",
      mode: directoAGoogle ? "no-cors" : "cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(fila)
    })["catch"](function(){});
  } catch(e){}
}

function pintarResultado(){
  var r = calcular();
  guardarEnHoja(r);
  var textoWa = encodeURIComponent(resumenParaDavid(r));
  var enlaceWa = "https://wa.me/" + WHATSAPP + "?text=" + textoWa;
  var html = "";

  if (r.semaforo === "verde"){
    html += '<div class="res verde">' +
      '<h1>Tu caso se ve sólido</h1>' +
      '<p>' + esc(primerNombre()) + ', por la información que nos compartes, tu perfil reúne lo que el oficial consular evalúa: razones claras para regresar y con qué acreditarlas. No constituye una garantía, porque ninguna existe, pero es un buen punto de partida.</p>' +
      '<p style="margin-bottom:0"><strong>El siguiente paso es conversar con David</strong> para revisar los detalles y definir juntos cuándo iniciar.</p>' +
      '</div>';
    if (r.mostrar.length){
      html += '<h2>Aspectos a tener en cuenta</h2>' + listaPuntos(r.mostrar);
    }
    html += bloqueSiguientesPasos();
    html += '<a class="btn btn-wa" href="' + enlaceWa + '">Enviarle mi caso a David por WhatsApp</a>';
    html += '<p class="nota" style="text-align:center;margin-top:14px">Se abre WhatsApp con tu resumen ya redactado. Solo tienes que enviarlo.</p>';

  } else if (r.semaforo === "ambar"){
    html += '<div class="res ambar">' +
      '<h1>Tu caso es viable, aunque presenta puntos a reforzar</h1>' +
      '<p>' + esc(primerNombre()) + ', preferimos ser precisos: hay aspectos de tu perfil que el oficial consular examinará con especial atención.</p>' +
      '<p style="margin-bottom:0">Puedes presentarte de todos modos y reforzar el caso por otras vías, o esperar un tiempo y llegar en mejores condiciones. Esa decisión es tuya, ahora con la información completa.</p>' +
      '</div>';
    html += '<h2>Aspectos a reforzar</h2>' + listaPuntos(r.mostrar.length ? r.mostrar : ["Tu perfil no muestra puntos fuertes que destaquen"]);
    html += bloqueSiguientesPasos();
    html += '<a class="btn btn-wa" href="' + enlaceWa + '">Quiero hablarlo con David</a>';
    html += '<p class="nota" style="text-align:center;margin-top:14px">Se abre WhatsApp con tu resumen ya escrito. Solo tienes que darle enviar.</p>';

  } else {
    html += '<div class="res rojo">' +
      '<h1>Todavía no es tu momento</h1>' +
      '<p>' + esc(primerNombre()) + ', preferimos advertírtelo ahora antes de que inviertas tiempo y dinero en una solicitud con escasas probabilidades. El arancel consular no se reembolsa.</p>' +
      '<p style="margin-bottom:0"><strong>No se trata de una negativa definitiva, sino de un &laquo;todavía no&raquo;.</strong></p>' +
      '</div>';
    html += '<h2>Aspectos que hoy juegan en contra</h2>' + listaPuntos(r.mostrar.length ? r.mostrar : ["Tu perfil todavía no muestra razones fuertes para regresar"]);
    html += '<div class="recuadro">' +
      '<h2>Cuando esos puntos mejoren, vuelve</h2>' +
      '<p style="margin-bottom:0;font-size:.97rem;color:#4a5a56">Tu caso se fortalece de forma notable y te acompañamos con mucha mayor confianza. Guarda esta página y vuelve a completar el formulario cuando tu situación cambie.</p>' +
      '</div>';
    html += '<a class="btn btn-2" href="' + enlaceWa + '">Quiero que David lo revise igual</a>';
    html += '<p class="nota" style="text-align:center;margin-top:14px">Si consideras que hay algo de tu situación que el formulario no recogió, coméntaselo.</p>';
  }

  html += '<p class="nota" style="text-align:center;margin-top:26px"><a href="../">Volver a la página</a></p>';
  app.innerHTML = html;
  window.scrollTo(0,0);
  etiquetaPaso.textContent = "Tu resultado";
}

function primerNombre(){
  return (respuestas.nombre || "").split(" ")[0] || "";
}

function listaPuntos(bs){
  var h = '<ul class="puntos">';
  bs.forEach(function(b){
    h += '<li><b>' + esc(b) + '</b>' + (CONSEJOS[b] ? '<span>' + esc(CONSEJOS[b]) + '</span>' : '') + '</li>';
  });
  return h + '</ul>';
}

function bloqueSiguientesPasos(){
  return '<div class="recuadro"><h2>Qué pasa ahora</h2><ol>' +
    '<li>Envías tu caso a David por WhatsApp con el botón de abajo.</li>' +
    '<li>Él lo revisa y te contacta para coordinar una llamada.</li>' +
    '<li>En la llamada resuelven dudas y definen si continuar.</li>' +
    '<li>Solo entonces se confirma el servicio y se completa el formulario detallado.</li>' +
    '</ol></div>';
}

/* arranque */
var inicio = siguienteIndice(0);
if (inicio === -1) pintarContacto(); else pintarPregunta(inicio);
</script>
