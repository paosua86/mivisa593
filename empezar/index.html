<script>
"use strict";

/* ============================================================
   CONFIGURACIÓN
   Para editar el formulario, toca solo este bloque.

/* Aquí ya no se usa WhatsApp: el caso viaja por correo a David y la
   persona sale de esta página con su link, no con un mensaje que
   enviar. El número sigue viviendo en caso/ y pago/, donde sí hace
   falta (el link de PayPhone lo genera David a mano). */
var CLAVE_GUARDADO = "mivisaec_precalificacion";

/* Dónde se graban los casos completos.
   Puede ser la URL de Apps Script (queda visible en el código fuente)
   o la del Worker de Cloudflare, que la esconde. Ver
   herramientas/cloudflare-worker-casos.js
   Si se deja vacío, el formulario funciona igual pero no guarda nada. */
var ENDPOINT_GUARDADO = "https://script.google.com/macros/s/AKfycbxB8bkBNzeRVzkzk7QSH-iZ5itcAUm33VRfX2lSaLLb_gzMmhZfU7RHGf_rOob1e2hL/exec";

/* ------------------------------------------------------------
   EL CÓDIGO DEL CASO SE GENERA AQUÍ, EN EL NAVEGADOR

   Antes lo inventaba el Apps Script. El problema es que el envío
   contra Google no siempre puede leer la respuesta, así que esta
   página nunca llegaba a saber cuál era el código del caso, y por eso
   no podía mostrarle a la persona su propio link: había que esperar a
   que David lo copiara de la hoja y se lo mandara por WhatsApp.

   Generándolo aquí, la pantalla de resultado ya tiene el link sin
   depender de nada. El script lo valida y, en el caso improbable de
   que choque con otro, pone uno distinto (y entonces el que manda es
   el del correo, no el de la pantalla).

   El alfabeto no tiene O/0, I/1 ni L, para que se pueda dictar por
   teléfono sin confusiones. Son 31^6 ≈ 887 millones de combinaciones.
   ------------------------------------------------------------ */
var ALFABETO_CODIGO = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

function codigoNuevo(){
  var n = new Uint32Array(6);
  try { crypto.getRandomValues(n); }
  catch(e){ for (var j=0;j<6;j++) n[j] = Math.floor(Math.random()*4294967296); }
  var c = "";
  for (var i=0;i<6;i++) c += ALFABETO_CODIGO.charAt(n[i] % ALFABETO_CODIGO.length);
  return c;
}

/* Cada pregunta:
   id        clave con la que se guarda la respuesta
   titulo    lo que se lee grande
   ayuda     línea explicativa opcional
   opciones  [{v: valor, t: texto, s: subtexto, p: puntos,
               bandera: "texto",   // punto flojo serio, se muestra siempre
               flojo:   "texto",   // punto flojo leve, solo si el caso no es verde
               fuerte:  "texto"}]  // punto a favor, va en el resumen de David
   si        función(r) -> true si esta pregunta aplica al caso   */

var PREGUNTAS = [
  {
    id: "destino",
    titulo: "¿Cuál es tu país destino?",
    opciones: [
      {v:"usa",      t:"Estados Unidos",  s:"Visa de turismo B1/B2"},

      {v:"no-se",    t:"Todavía no lo decido"}
    ]
  },
  {
    id: "aplico_antes",
    titulo: "¿Ya habías pedido esta visa antes?",
    opciones: [
      {v:"nunca",    t:"No, es mi primera vez", p:0},
      {v:"aprobada", t:"Sí, y me la dieron",    s:"Sería una renovación", p:3, fuerte:"Ya tuviste la visa antes: es una renovación"},
      {v:"negada",   t:"Sí, y me la negaron",   p:0}
    ]
  },
  {
    id: "cuando_negada",
    si: function(r){ return r.aplico_antes === "negada"; },
    titulo: "¿Hace cuánto te la negaron?",
    opciones: [
      {v:"menos1",  t:"Hace menos de un año",  p:-2},
      {v:"1a2",     t:"Entre uno y dos años",  p:-1},

    ]
  },
  {
    id: "cambio_algo",
    si: function(r){ return r.aplico_antes === "negada"; },
    titulo: "Desde que te la negaron, ¿cambió algo importante en tu vida?",
    ayuda: "Un nuevo empleo, un viaje a otro país, un hijo, una propiedad o mayores ingresos.",
    opciones: [
      {v:"si", t:"Sí, varias cosas cambiaron",  p:2, fuerte:"Tu situación cambió desde la negación anterior"},
      {v:"algo", t:"Alguna cosa, no mucho",     p:0, flojo:"Cambió poco desde la negación anterior"},
      {v:"no", t:"No, sigo igual",              p:-2, bandera:"Negación reciente sin cambios en el perfil"}
    ]
  },
  {
    id: "viajes",
    titulo: "¿Has viajado antes a otros países?",
    ayuda: "Considera cualquier viaje al extranjero, aunque haya sido hace años.",
    opciones: [
      {v:"nunca",  t:"No, nunca he salido del país", p:-2, bandera:"Sin viajes internacionales previos"},
      {v:"latam",  t:"Sí, a países de Latinoamérica", s:"Colombia, Perú, Panamá, México…", p:0, flojo:"Solo has viajado dentro de Latinoamérica"},
      {v:"fuerte", t:"Sí, a Estados Unidos, Canadá, Europa o Asia", p:3, fuerte:"Has viajado a Estados Unidos, Canadá, Europa o Asia"}
    ]
  },
  {
    id: "trabajo",
    titulo: "¿Cuál es tu situación hoy?",
    opciones: [
      {v:"empleado",     t:"Trabajo en relación de dependencia", s:"Tengo un empleador", p:1},
      {v:"independiente",t:"Trabajo por mi cuenta o tengo negocio propio", p:1},
      {v:"estudiante",   t:"Soy estudiante", p:0, flojo:"Como estudiante hay que reforzar el respaldo económico"},
      {v:"jubilado",     t:"Soy jubilado", p:1},
      {v:"sin",          t:"Ahora mismo no estoy trabajando", p:-2, bandera:"Sin actividad laboral actual"}
    ]
  },
  {
    id: "antiguedad",
    si: function(r){ return r.trabajo === "empleado" || r.trabajo === "independiente"; },
    titulo: "¿Cuánto tiempo llevas ahí?",
    opciones: [
      {v:"menos6", t:"Menos de 6 meses",   p:-2, bandera:"Muy poco tiempo en la actividad actual"},
      {v:"6a24",   t:"Entre 6 meses y 2 años", p:1, flojo:"Poco tiempo en tu actividad actual"},
      {v:"mas2",   t:"Más de 2 años",      p:2, fuerte:"Más de 2 años en tu actividad actual"}
    ]
  },
  {
    id: "ingresos",
    titulo: "¿Puedes acreditar tus ingresos o ahorros con documentos?",
    ayuda: "Rol de pagos, certificado bancario, movimientos de cuenta o declaración de impuestos.",
    opciones: [
      {v:"si",   t:"Sí, sin problema", p:2, fuerte:"Puedes acreditar tus ingresos con documentos"},
      {v:"algo", t:"Algo, pero no todo", s:"Parte de mis ingresos no están respaldados", p:0, flojo:"Parte de tus ingresos no se puede acreditar documentalmente"},
      {v:"no",   t:"No, me sería difícil", p:-2, bandera:"Ingresos difíciles de demostrar"}
    ]
  },
  {
    id: "dependientes",
    titulo: "¿Tienes hijos o personas que dependan de ti aquí en Ecuador?",
    opciones: [
      {v:"si", t:"Sí", p:2, fuerte:"Tienes hijos o dependientes en Ecuador"},
      {v:"no", t:"No", p:0, flojo:"Sin hijos ni dependientes en Ecuador"}
    ]
  },
  {
    id: "pareja",
    titulo: "¿Tienes pareja o cónyuge?",
    opciones: [
      {v:"si_queda", t:"Sí, y se queda en Ecuador", p:1, fuerte:"Tu pareja se queda en Ecuador"},
      {v:"si_viaja", t:"Sí, y viaja conmigo", p:0},
      {v:"no",       t:"No tengo pareja", p:0}
    ]
  },
  {
    id: "bienes",
    titulo: "¿Tienes casa, terreno, vehículo o negocio a tu nombre?",
    ayuda: "No son un requisito. Únicamente suman a favor si los tienes.",
    opciones: [
      {v:"si", t:"Sí, alguno de esos", p:2, fuerte:"Tienes bienes a tu nombre"},
      {v:"no", t:"No, ninguno", p:0, flojo:"Sin bienes a tu nombre"}
    ]
  },
  {
    id: "pasaporte",
    titulo: "¿Cómo está tu pasaporte?",
    opciones: [
      {v:"vigente", t:"Vigente, le queda más de un año", p:1, fuerte:"Pasaporte vigente con buen margen"},
      {v:"pronto",  t:"Vigente, pero vence pronto", s:"En menos de 6 meses", p:0, bandera:"Pasaporte próximo a vencer: hay que renovarlo primero"},
      {v:"no",      t:"No tengo pasaporte todavía", p:0, bandera:"Sin pasaporte: es el primer trámite a resolver"}
    ]
  },
  {
    id: "cuando",
    titulo: "¿Para cuándo quieres viajar?",
    opciones: [
      {v:"ya",     t:"Lo antes posible", s:"En menos de un mes", p:0, bandera:"Fecha muy justa: las citas consulares tardan semanas"},
      {v:"1a3",    t:"En uno a tres meses", p:0},

  },
  {

    titulo: "¿Cuántas personas van a aplicar?",
    ayuda: "Contándote a ti.",
    opciones: [
      {v:"1", t:"Solo yo"},

];

/* Cómo se explica cada punto flojo en el resultado */
/* Los consejos que acompañan a cada punto en contra viven ahora en
   caso/index.html, que es donde se pintan. Aquí solo se generan las
   frases; el texto de acompañamiento se busca allá por esa frase. */


var NOMBRE_DESTINO = {usa:"Estados Unidos", canada:"Canadá", schengen:"Europa (Schengen)", "no-se":"Todavía sin decidir"};

/* ============================================================
   MOTOR
   ============================================================ */

var app = document.getElementById("app");
var barra = document.getElementById("barra");
var etiquetaPaso = document.getElementById("etiqueta-paso");
var respuestas = {};
var banderas = [];
var indice = 0;

/* Prellenar destino desde la URL: empezar/?destino=usa */
(function(){
  try {
    var p = new URLSearchParams(location.search);
    var d = p.get("destino");
    if (d && ["usa","canada","schengen"].indexOf(d) !== -1) respuestas.destino = d;
    var pais = p.get("pais");
    if (pais) respuestas.pais_schengen = pais;
  } catch(e){}
  try {
    var g = localStorage.getItem(CLAVE_GUARDADO);
    if (g) {
      var d2 = JSON.parse(g);
      if (d2 && d2.respuestas) respuestas = Object.assign(d2.respuestas, respuestas);
    }
  } catch(e){}
})();

function guardar(){
  try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify({respuestas:respuestas, fecha:Date.now()})); } catch(e){}
}

function aplica(q){ return !q.si || q.si(respuestas); }

function siguienteIndice(desde){
  for (var i = desde; i < PREGUNTAS.length; i++){
    if (aplica(PREGUNTAS[i]) && respuestas[PREGUNTAS[i].id] === undefined) return i;
  }
  return -1;
}

/* La pregunta anterior se deduce de lo ya contestado, no de un
   historial en memoria. Así el botón de volver sigue estando después
   de recargar la página, y también cuando el destino vino prellenado
   desde el link y su pregunta se saltó. */
function anteriorIndice(desde){
  for (var i = desde - 1; i >= 0; i--){
    if (aplica(PREGUNTAS[i]) && respuestas[PREGUNTAS[i].id] !== undefined) return i;
  }
  return -1;
}

function totalAplicables(){
  return PREGUNTAS.filter(aplica).length;
}

function contestadas(){
  return PREGUNTAS.filter(function(q){ return aplica(q) && respuestas[q.id] !== undefined; }).length;
}

/* La posición sale de la pregunta que se está mostrando, no de cuántas
   van contestadas: si no, al volver atrás el contador seguía marcando
   la pregunta siguiente. */
function progreso(i){
  var t = totalAplicables();
  var pos = PREGUNTAS.slice(0, i).filter(aplica).length;
  barra.style.width = Math.round((pos / t) * 100) + "%";
  etiquetaPaso.textContent = "Pregunta " + Math.min(pos + 1, t) + " de " + t;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function pintarPregunta(i){
  var q = PREGUNTAS[i];
  indice = i;
  progreso(i);

  var elegida = respuestas[q.id];
  var prev = anteriorIndice(i);

  var html = '<div class="pregunta activa">';
  html += '<h1>' + esc(q.titulo) + '</h1>';
  if (q.ayuda) html += '<p class="ayuda">' + esc(q.ayuda) + '</p>';
  html += '<div class="ops">';
  q.opciones.forEach(function(op){
    var marcada = elegida !== undefined && String(op.v) === String(elegida);
    html += '<button class="op" type="button" data-v="' + esc(op.v) + '" aria-pressed="' + marcada + '">' +
              '<span class="marca-op"></span>' +
              '<span>' + esc(op.t) + (op.s ? '<small>' + esc(op.s) + '</small>' : '') + '</span>' +
            '</button>';
  });
  html += '</div>';
  if (prev !== -1) html += '<div class="pie-nav"><button class="atras" type="button" id="atras">← Volver a la anterior</button></div>';
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0,0);

  app.querySelectorAll(".op").forEach(function(b){
    b.addEventListener("click", function(){
      app.querySelectorAll(".op").forEach(function(o){ o.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      var op = q.opciones.filter(function(o){ return String(o.v) === b.dataset.v; })[0];
      respuestas[q.id] = op.v;
      guardar();
      setTimeout(avanzar, 160);
    });
  });

  var atras = document.getElementById("atras");
  if (atras) atras.addEventListener("click", function(){ pintarPregunta(prev); });
}

/* Al cambiar una respuesta, algunas preguntas dejan de aplicar: si el
   destino pasa de Europa a Canadá, el país de Schengen ya no viene al
   caso. Se limpian para que no lleguen a la hoja datos que no
   corresponden al caso final. */
function limpiarNoAplicables(){
  PREGUNTAS.forEach(function(q){
    if (!aplica(q) && respuestas[q.id] !== undefined) delete respuestas[q.id];
  });
  if (respuestas.destino !== "schengen") delete respuestas.pais_schengen;
  guardar();
}

/* Volver atrás no borra la respuesta: la deja marcada para que se vea
   qué se había elegido. Al contestar de nuevo, avanzar() salta sola a
   la primera pregunta que siga sin responder. */
function avanzar(){
  limpiarNoAplicables();
  var sig = siguienteIndice(0);
  if (sig === -1) pintarContacto();
  else pintarPregunta(sig);
}

/* ---------- puntuación ---------- */
function calcular(){
  var puntos = 0;
  banderas = [];
  var flojos = [];
  var fuertes = [];
  PREGUNTAS.forEach(function(q){
    if (!aplica(q)) return;
    var v = respuestas[q.id];
    if (v === undefined) return;
    var op = q.opciones.filter(function(o){ return String(o.v) === String(v); })[0];
    if (!op) return;
    if (typeof op.p === "number") puntos += op.p;
    if (op.bandera) banderas.push(op.bandera);
    if (op.flojo) flojos.push(op.flojo);
    if (op.fuerte) fuertes.push(op.fuerte);
  });

  var semaforo = puntos >= 6 ? "verde" : (puntos >= 2 ? "ambar" : "rojo");

  /* Reglas duras: mandan por encima del puntaje.
     Salen de los descalificadores que David usa en su propio guion. */
  if (respuestas.aplico_antes === "negada" &&
      respuestas.cuando_negada === "menos1" &&
      respuestas.cambio_algo === "no") {
    semaforo = "rojo";
  }
  if (respuestas.pasaporte === "no") {
    semaforo = semaforo === "verde" ? "ambar" : semaforo;
  }

  /* En verde solo se muestran los puntos serios; en ámbar y rojo, todos. */
  var mostrar = semaforo === "verde" ? banderas : banderas.concat(flojos);

  return {puntos:puntos, semaforo:semaforo, banderas:banderas, flojos:flojos, fuertes:fuertes, mostrar:mostrar};
}

/* ---------- pantalla de contacto ---------- */
function pintarContacto(){
  barra.style.width = "100%";
  etiquetaPaso.textContent = "Último paso";
  app.innerHTML =
    '<div class="pregunta activa">' +
      '<h1>Listo. ¿A dónde te enviamos el resultado?</h1>' +
      '<p class="ayuda">En la pantalla siguiente ves tu resultado, y al correo te llega tu página personal para seguir tu trámite.</p>' +
      '<label class="campo">Tu nombre y apellido' +
        '<input type="text" id="c-nombre" autocomplete="name" placeholder="Ana Pérez">' +
      '</label>' +
      '<label class="campo">Tu WhatsApp' +
        '<input type="tel" id="c-tel" autocomplete="tel" inputmode="numeric" placeholder="09 9999 9999">' +
        '<small>Con el 09 al inicio, como lo marcas normalmente.</small>' +
      '</label>' +
      '<label class="campo">Tu correo' +
        '<input type="email" id="c-mail" autocomplete="email" placeholder="ana@correo.com">' +
        '<small>Ahí te llega el link de tu caso, para que no dependas de que nadie te lo reenvíe.</small>' +
      '</label>' +
      '<label class="consent"><input type="checkbox" id="c-ok">' +
        '<span>Autorizo a MiVisa EC a usar estos datos para revisar mi caso y contactarme. Puedo pedir que los borren cuando quiera. He leído los <a href="../terminos.html" target="_blank">términos</a> y la <a href="../privacidad.html" target="_blank">política de privacidad</a>.</span>' +
      '</label>' +
      '<button class="btn" type="button" id="ver" disabled>Ver el resultado de mi caso</button>' +
      '<div class="pie-nav"><button class="atras" type="button" id="atras">← Volver a la anterior</button></div>' +
    '</div>';
  window.scrollTo(0,0);

  var nombre = document.getElementById("c-nombre");
  var tel = document.getElementById("c-tel");
  var mail = document.getElementById("c-mail");
  var ok = document.getElementById("c-ok");
  var ver = document.getElementById("ver");

  /* El correo pasó a ser obligatorio: es por donde le llega su página
     personal y, más tarde, el aviso de que ya puede llenar el
     formulario. Sin correo, la única forma de alcanzarla vuelve a ser
     que David le escriba a mano, que es justo lo que se quitó. */
  function revisar(){
    var telLimpio = tel.value.replace(/\D/g,"");
    var correoOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value.trim());
    ver.disabled = !(nombre.value.trim().length > 2 && telLimpio.length >= 9 && correoOk && ok.checked);
  }
  [nombre, tel, mail].forEach(function(c){ c.addEventListener("input", revisar); });
  ok.addEventListener("change", revisar);

  ver.addEventListener("click", function(){
    respuestas.nombre = nombre.value.trim();
    respuestas.telefono = tel.value.trim();
    respuestas.correo = mail.value.trim();
    respuestas.consentimiento = true;
    guardar();
    pintarResultado();
  });

  document.getElementById("atras").addEventListener("click", function(){
    var prev = anteriorIndice(PREGUNTAS.length);
    if (prev === -1) return;
    pintarPregunta(prev);
  });
}

/* ---------- resultado ---------- */

/* Manda el caso completo a la hoja de cálculo y devuelve una promesa
   con el código definitivo.

   Se intenta leer la respuesta del script (modo `cors`). El envío no
   lleva cabeceras raras, así que el navegador no hace preflight y
   Google contesta con `Access-Control-Allow-Origin: *` desde la
   redirección: en la práctica se puede leer. Si por lo que sea no se
   puede, no se rompe nada — se sigue con el código que generó esta
   página, que es el mismo que el script va a guardar salvo choque. */
function armarFila(r, codigo){
  var fila = {
    fecha: new Date().toISOString(),
    codigo: codigo,
    nombre: respuestas.nombre || "",
    telefono: respuestas.telefono || "",
    correo: respuestas.correo || "",
    destino: NOMBRE_DESTINO[respuestas.destino] || respuestas.destino || "",
    pais_schengen: respuestas.pais_schengen || "",
    personas: respuestas.personas || "",
    semaforo: r.semaforo,
    puntos: r.puntos,
    a_favor: r.fuertes.join(" | "),
    en_contra: r.mostrar.join(" | "),
    consentimiento: respuestas.consentimiento ? "Sí" : "No"
  };
  PREGUNTAS.forEach(function(q){
    var v = respuestas[q.id];
    if (v === undefined) { fila[q.id] = ""; return; }
    var op = q.opciones.filter(function(o){ return String(o.v) === String(v); })[0];
    fila[q.id] = op ? op.t : v;
  });
  return fila;
}

function guardarEnHoja(fila, codigo){
  if (!ENDPOINT_GUARDADO) return Promise.resolve(codigo);

  return fetch(ENDPOINT_GUARDADO, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(fila)
  })
    .then(function(res){ return res.json(); })
    .then(function(d){ return (d && d.ok && d.codigo) ? d.codigo : codigo; })
    ["catch"](function(){ return codigo; });
}

/* Espera al guardado, pero no para siempre: si el script tarda, se
   pinta igual con el código local en vez de dejar a la persona
   mirando un cargando eterno. */
function conTope(promesa, ms, respaldo){
  return Promise.race([
    promesa,
    new Promise(function(ok){ setTimeout(function(){ ok(respaldo); }, ms); })
  ]);
}

/* Identifica el servicio igual que lo hace el Apps Script, para que la
   página del caso pueda mostrar el precio sin consultar nada. */
function servicioDe(fila){
  var d = String(fila.destino || "").toLowerCase();
  var renovacion = String(fila.aplico_antes || "").toLowerCase().indexOf("dieron") !== -1;
  if (d.indexOf("estados unidos") !== -1) return renovacion ? "usa-renovacion" : "usa-primera";
  if (d.indexOf("canad") !== -1)          return renovacion ? "canada-renovacion" : "canada-primera";
  if (d.indexOf("europa") !== -1 || d.indexOf("schengen") !== -1) return "schengen";
  return "";
}

/* ------------------------------------------------------------
   AQUÍ TERMINA ESTE FORMULARIO

   La pantalla de resultado no se pinta aquí: ES la página del caso.
   Antes se pintaba el semáforo en esta página y se ponía un botón que
   llevaba a /caso/, así que la persona veía dos veces lo mismo y el
   bloque de pago habría tenido que existir en los dos archivos.

   Ahora se le deja el resultado servido en sessionStorage y se la
   lleva directo a su página, que pinta al instante sin esperar al
   servidor. Una sola pantalla, una sola URL — la misma a la que
   apunta el link de su correo.

   Va con location.replace para que el botón "atrás" no la devuelva a
   una pantalla de carga que ya no significa nada.
   ------------------------------------------------------------ */
function pintarResultado(){
  var r = calcular();
  var codigo = codigoNuevo();
  var fila = armarFila(r, codigo);

  app.innerHTML =
    '<div class="pregunta activa"><h1>Revisando tu caso…</h1>' +
    '<p class="ayuda">Un momento, estamos preparando tu página personal.</p></div>';
  window.scrollTo(0,0);
  etiquetaPaso.textContent = "Casi listo";

  conTope(guardarEnHoja(fila, codigo), 9000, codigo).then(function(definitivo){
    try {
      sessionStorage.setItem("mivisaec_caso_" + definitivo, JSON.stringify({
        ok: true,
        codigo:     definitivo,
        nombre:     fila.nombre,
        destino:    fila.destino,
        personas:   fila.personas,
        semaforo:   fila.semaforo,
        servicio:   servicioDe(fila),
        a_favor:    fila.a_favor,
        en_contra:  fila.en_contra,
        correo:     fila.correo,
        pagoConfirmado: false,
        pagoDeclarado:  false,
        expediente:     false
      }));
    } catch(e){}
    location.replace("../caso/?c=" + encodeURIComponent(definitivo));
  });
}

/* arranque */
var inicio = siguienteIndice(0);
if (inicio === -1) pintarContacto(); else pintarPregunta(inicio);
</script>
